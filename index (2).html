<style>
:root{
  --bg:#0F1115; --bg2:#171A21; --ink:#F3F4F7; --muted:#A3A9B8; --line:#2A2F3B;
  --silver:linear-gradient(110deg,#8E94A3 0%,#F4F5F8 30%,#9AA0AE 50%,#FFFFFF 70%,#8E94A3 100%);
  --display:'Bodoni Moda',Georgia,serif; --body:'Jost','Cairo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.75;font-size:17px;overflow-x:hidden}
html[lang=ar] body{font-family:'Cairo','Jost',sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--display);letter-spacing:.14em;font-size:1.05rem}
.brand img{width:40px;height:40px;border-radius:50%}
nav{display:flex;align-items:center;gap:22px}
nav a{text-decoration:none;color:var(--muted);font-size:.95rem}
nav a:hover{color:#fff}
.lang{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}
.lang:hover{border-color:#fff}
@media(max-width:700px){nav a.nl{display:none}}

/* Hero */
.hero{min-height:calc(100vh - 68px);display:grid;place-items:center;text-align:center;padding:48px 0 72px;position:relative}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.1),transparent 55%);pointer-events:none}
.logo-wrap{position:relative;width:min(300px,64vw);aspect-ratio:1;margin:0 auto 32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px #3a4050,0 30px 80px -20px rgba(255,255,255,.25);animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
.logo-wrap img{width:100%;height:100%;display:block}
.logo-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 3.6s 1.4s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,6vw,4rem);line-height:1.15;background:var(--silver);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s .5s both,flow 8s linear infinite}
html[lang=ar] .hero h1{font-family:'Cairo',sans-serif;font-weight:600}
.hero p{max-width:46ch;margin:18px auto 32px;color:var(--muted);font-size:1.1rem;animation:rise .9s .7s both}
.cta{animation:rise .9s .9s both;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flow{to{background-position:-200% 0}}
.btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0F1115;padding:13px 28px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem;border:1px solid #fff;cursor:pointer;font-family:inherit;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);background:transparent;color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:#4a5163}
.btn.ghost:hover{border-color:#fff}

/* Sections */
section{padding:84px 0;border-top:1px solid var(--line)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.2;margin-bottom:14px}
html[lang=ar] h2{font-family:'Cairo',sans-serif;font-weight:600}
.lead{color:var(--muted);max-width:54ch;margin-bottom:34px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
.story{max-width:720px}
.story p{margin-bottom:18px;color:#D5D8E0}
.story .q{font-size:1.25rem;color:#fff;border-inline-start:2px solid #fff;padding-inline-start:18px;margin-bottom:28px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.chip{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem;transition:all .2s}
.chip:hover{border-color:#fff}
.chip[aria-pressed=true]{background:#fff;color:#0F1115;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;transition:transform .3s,border-color .3s;animation:rise .6s both}
.card:hover{transform:translateY(-6px);border-color:#5b6377}
.art{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 40%,#0F1115),#12151B 70%);margin-bottom:16px}
.art img{width:100%;height:100%;object-fit:cover;border-radius:6px;transition:transform .5s}
.card:hover .art img{transform:scale(1.05)}
.art{overflow:hidden}
.mini{width:32%;aspect-ratio:3/4;position:relative;margin-top:14%;border-radius:8px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 18px 30px -12px rgba(0,0,0,.7);transition:transform .4s}
.card:hover .mini{transform:translateY(-6px) rotate(-3deg)}
.mini:before{content:"";position:absolute;left:30%;width:40%;top:-26%;height:26%;background:linear-gradient(90deg,#9aa0ae,#fff,#9aa0ae);border-radius:3px 3px 1px 1px}
.card h3{font-family:var(--display);font-weight:400;font-size:1.3rem}
html[lang=ar] .card h3{font-family:'Cairo',sans-serif;font-weight:600}
.fam{color:var(--muted);font-size:.9rem}
.notes{margin:8px 0 16px;font-size:.95rem;flex:1;color:#D5D8E0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:500}
.order{font-size:.88rem;text-decoration:none;background:#fff;color:#0F1115;padding:8px 16px;border-radius:999px;font-weight:500;transition:transform .2s}
.order:hover{transform:scale(1.06)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.info a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .25s}
.info a:hover{padding-inline-start:10px}
.info small{display:block;color:var(--muted);font-size:.8rem}
form{display:grid;gap:12px}
input,textarea{font:inherit;padding:13px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
input:focus,textarea:focus{border-color:#fff;outline:none}
footer{padding:36px 0;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);text-align:center}
.wa-float{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:30;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pulse 2.4s infinite}
.wa-float svg{width:28px;height:28px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%,100%{box-shadow:0 0 0 18px rgba(37,211,102,0)}}
@media(max-width:760px){.contact{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(e=>io.observe(e));
$("#yr").textContent=new Date().getFullYear();
applyLang();
</script>
</body>
</html>
